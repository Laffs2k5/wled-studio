# Egress allowlist for wled-studio-builder: the builder sits on an internal network
# without internet access and reaches only these hosts, through this proxy.
http_port 3128

acl builder_hosts dstdomain .github.com .githubusercontent.com
acl builder_hosts dstdomain .platformio.org
acl builder_hosts dstdomain pypi.org files.pythonhosted.org
acl builder_hosts dstdomain registry.npmjs.org
acl builder_hosts dstdomain storage.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow builder_hosts
http_access deny all

# no cache; logs in squid's own log directory (squid drops to its user "proxy", which
# can't open the container's stdout). The access log shows every allowed and refused
# request: docker compose exec egress cat /var/log/squid/access.log
cache deny all
buffered_logs off
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename none
