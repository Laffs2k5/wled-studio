# Egress allowlist for wled-studio-builder: the builder sits on an internal network
# without internet access and reaches only these hosts, through this proxy.
http_port 3128

# -n: match the host name in the request only. Without it, squid matches a request
# for a bare IP address by that address's reverse DNS, which whoever owns the address
# sets: a PTR record of x.github.com would get any server through.
# Expected refusals: PlatformIO checks for internet with GET http://185.199.110.153 (a
# GitHub address; platformio/http.py, _internet_on). Through a proxy any answer counts as
# online, this 403 included, so builds go on; don't allow bare IPs for it.
acl builder_hosts dstdomain -n .github.com .githubusercontent.com
acl builder_hosts dstdomain -n .platformio.org
acl builder_hosts dstdomain -n pypi.org files.pythonhosted.org
acl builder_hosts dstdomain -n registry.npmjs.org
acl builder_hosts dstdomain -n storage.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow builder_hosts
http_access deny all

# no cache; logs in squid's own log directory (squid drops to its user "proxy", which
# can't open the container's stdout). The access log shows every allowed and refused
# request: docker compose exec egress cat /var/log/squid/access.log
cache deny all
buffered_logs off
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename none
