name: ci

# Test the backend and the web UI, build the image, run it with the demo device
# and the end-to-end smoke test, then publish it to ghcr.io (main and tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest --cov --cov-report=term --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run --coverage --coverage.thresholds.statements=85
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64, for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/laffs2k5/wled-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: An effect for the code editor's browser test (read-only for the app)
        run: |
          mkdir -p effects/e2e_fx
          printf '%s\n' '#include "wled.h"' '' 'namespace {' 'void mode_e2e() {' '  if (SEGLEN > 0) {' '    SEGMENT.fill(SEGCOLOR(0));' '  }' '}' '}  // namespace' > effects/e2e_fx/e2e_fx.cpp
          printf '{"name": "e2e-fx"}\n' > effects/e2e_fx/library.json
      - name: Run with the demo device, end-to-end smoke test
        env:
          WLEDSTUDIO_TAG: ci
        run: |
          docker compose --profile demo up -d --no-build
          scripts/smoke.sh http://127.0.0.1:8080 demo-device:8081
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - name: Browser tests (Playwright, Chromium) against the running containers
        working-directory: e2e
        env:
          WLEDSTUDIO_URL: http://127.0.0.1:8080
          DEVICE_HOST: demo-device:8081
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore
      - name: Container logs
        if: always()
        env:
          WLEDSTUDIO_TAG: ci
        run: docker compose --profile demo logs --no-color | tail -n 200
      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (amd64, arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
