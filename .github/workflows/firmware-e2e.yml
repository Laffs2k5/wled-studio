name: firmware-e2e

# The firmware profile end to end: the builder's egress allowlist, then a real
# preview job and a real gate build through the app. Slow (Emscripten install and
# two firmware builds), so not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 2"
  push:
    branches: [main]
    paths: ["compose.yaml", "proxy/**", "scripts/firmware-e2e.sh", ".github/workflows/firmware-e2e.yml",
            "backend/src/wledstudio/firmware.py"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # to wait for this commit's ci run

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WLEDSTUDIO_BUILDER_URL: http://builder:8090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This runs the published app image, which this commit's ci run publishes: wait for it,
      # or the test pulls the previous image (a race seen 2026-11-23).
      - name: Wait for this commit's ci
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            c=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$c" in
              "completed success") echo "ci passed"; exit 0 ;;
              "completed "*) echo "ci: $c"; exit 1 ;;
            esac
            sleep 20
          done
          echo "ci didn't finish in 30 minutes"; exit 1
      - name: Start (published images)
        run: docker compose --profile firmware --profile demo up -d --no-build
      - name: Network policy, preview job, gate build
        run: scripts/firmware-e2e.sh
      - name: Logs
        if: always()
        run: |
          docker compose --profile firmware logs --no-color | tail -n 300
          echo "== proxy access log (allowed and refused requests)"
          docker compose --profile firmware exec -T -u proxy egress cat /var/log/squid/access.log | awk '{print $4, $6, $7}' | sort | uniq -c | sort -rn | head -40 || true
