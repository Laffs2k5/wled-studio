# docker compose up                  -> http://localhost:8080
# docker compose --profile demo up   -> also a fake WLED device; add it as host "demo-device:8081"
# docker compose --profile virtual up
#                                    -> also a virtual WLED (WLED's own code, built from
#                                       wled-studio-builder); add it as host "virtual-device:8080"
# WLEDSTUDIO_BUILDER_URL=http://builder:8090 docker compose --profile firmware up
#                                    -> also the firmware builder (wled-studio-builder); your own
#                                       effects (usermod folders) go in ./effects (git-ignored)
services:
  wled-studio:
    image: ghcr.io/laffs2k5/wled-studio:${WLEDSTUDIO_TAG:-edge}
    build: .
    # localhost only by default; to use it from other machines on your LAN, change
    # this to "8080:8080" and add the name you browse to to WLEDSTUDIO_ALLOWED_HOSTS
    # (see docs/security.md)
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WLEDSTUDIO_ALLOWED_HOSTS: ${WLEDSTUDIO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      WLEDSTUDIO_TOKEN: ${WLEDSTUDIO_TOKEN:-}
      WLEDSTUDIO_BUILDER_URL: ${WLEDSTUDIO_BUILDER_URL:-}
      WLEDSTUDIO_EFFECTS_DIR: /effects
      # an effect folder that is a git clone: commit (on) and push (an SSH deploy key, mounted
      # read-only; see docs/getting-started.md)
      WLEDSTUDIO_EFFECTS_GIT: ${WLEDSTUDIO_EFFECTS_GIT:-}
      WLEDSTUDIO_EFFECTS_GIT_KEY: ${WLEDSTUDIO_EFFECTS_GIT_KEY:-}
      WLEDSTUDIO_EFFECTS_GIT_AUTHOR: ${WLEDSTUDIO_EFFECTS_GIT_AUTHOR:-}
      TZ: ${TZ:-UTC}   # your time zone (e.g. Europe/Oslo): commit times and logs
      # flashing firmware: off unless "on", and only behind a client-certificate proxy (docs/security.md)
      WLEDSTUDIO_FLASHING: ${WLEDSTUDIO_FLASHING:-}
      WLEDSTUDIO_FLASH_CERT_HEADER: ${WLEDSTUDIO_FLASH_CERT_HEADER:-}
    networks: [default, builder-net, virtual-net]
    volumes:
      - wled-studio-data:/data
      # your effect usermods, edited in the Effect studio (the app runs as uid 10001:
      # sudo chown -R 10001:10001 effects, or edit them on the host only)
      - ${WLEDSTUDIO_EFFECTS_DIR:-./effects}:/effects
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  demo-device:
    profiles: [demo]
    image: ghcr.io/laffs2k5/wled-studio:${WLEDSTUDIO_TAG:-edge}
    build: .
    entrypoint: ["wled-studio-fake-device"]
    environment:
      FAKE_WLED_HOST: 0.0.0.0
      FAKE_WLED_PORT: "8081"
      FAKE_WLED_PIN: ${FAKE_WLED_PIN:-}
    read_only: true
    tmpfs:
      - /tmp   # uploads over 1 MB (a firmware image) are spooled to a temporary file
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # A virtual WLED device: a twin of QuinLED's 16.0.1 (WLED's own effects, presets, playlists and
  # API, compiled to WebAssembly) built from wled-studio-builder's virtual/Dockerfile. It sits on
  # an internal network shared only with the app (no internet, no LAN, no port); it can't be
  # flashed. VIRTUAL_LEDS: LEDs per output, e.g. 124,126.
  virtual-device:
    profiles: [virtual]
    image: wled-virtual:local
    build:
      context: https://github.com/Laffs2k5/wled-studio-builder.git#main
      dockerfile: virtual/Dockerfile
    networks: [virtual-net]
    environment:
      LEDS: ${VIRTUAL_LEDS:-60}
      NAME: ${VIRTUAL_NAME:-Virtual WLED}
    volumes:
      - virtual-device-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  builder:
    profiles: [firmware]
    image: ghcr.io/laffs2k5/wled-studio-builder:${BUILDER_TAG:-edge}
    entrypoint: ["/home/builder/venv/bin/python", "/home/builder/studio-src/studio/service.py"]
    # no ports, and no internet of its own: it sits on an internal network that only
    # wled-studio and the egress proxy share, and fetches sources through the proxy's
    # allowlist (proxy/squid.conf)
    networks: [builder-net]
    environment:
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
    volumes:
      - builder-work:/work
      - builder-out:/out
      - ${WLEDSTUDIO_EFFECTS_DIR:-./effects}:/effects:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  egress:
    profiles: [firmware]
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    networks: [builder-net, egress-net]
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]   # squid starts as root and drops to its own user
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  default:
  builder-net:
    internal: true
  virtual-net:
    internal: true
  egress-net:

volumes:
  wled-studio-data:
  virtual-device-data:
  builder-work:
  builder-out:
