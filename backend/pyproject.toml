[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wledstudio"
version = "0.1.0"
description = "A local web app for WLED: looks, playlists, palettes and effect settings"
license = "EUPL-1.2"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
wled-studio = "wledstudio.__main__:main"
wled-studio-fake-device = "wledstudio.fakewled.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wledstudio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
